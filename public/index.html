<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Namya — AI Assistant</title>
<style>
  :root {
    --bg: #0b0d10;
    --bg-soft: #12151a;
    --bubble-user: #2f6fed;
    --bubble-ai: #171b22;
    --text: #eceef3;
    --text-dim: #9aa3b2;
    --border: #222833;
    --accent: #7aa2ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
  }
  /* ---- header ---- */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px; border-bottom: 1px solid var(--border);
    background: rgba(11,13,16,.92); backdrop-filter: blur(12px);
    z-index: 10;
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #2f6fed, #9b5cf6);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 19px; color: #fff;
    box-shadow: 0 2px 12px rgba(80,110,255,.35);
  }
  .who { flex: 1; min-width: 0; }
  .who .name { font-weight: 650; font-size: 16px; letter-spacing: .1px; }
  .who .status { font-size: 12px; color: #58d68d; display: flex; align-items: center; gap: 5px; margin-top: 1px; }
  .who .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #58d68d; display: inline-block; }
  #meminfo { font-size: 13px; color: var(--text-dim); cursor: pointer; padding: 6px 10px; border-radius: 16px; background: var(--bg-soft); border: 1px solid var(--border); }
  #meminfo:empty { display: none; }
  /* ---- chat ---- */
  #chat {
    flex: 1; overflow-y: auto; padding: 22px 18px 12px;
    display: flex; flex-direction: column; gap: 18px;
    max-width: 780px; width: 100%; margin: 0 auto;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  .row { display: flex; gap: 10px; align-items: flex-end; animation: fadeUp .25s ease; }
  .row.user { justify-content: flex-end; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .row .avatar.sm { width: 30px; height: 30px; font-size: 14px; }
  .msg {
    max-width: 78%; padding: 11px 15px; line-height: 1.55; font-size: 15px;
    white-space: pre-wrap; word-wrap: break-word; border-radius: 20px;
  }
  .row.user .msg { background: var(--bubble-user); color: #fff; border-bottom-right-radius: 6px; }
  .row.model .msg { background: var(--bubble-ai); border: 1px solid var(--border); border-bottom-left-radius: 6px; }
  .msg img.attached { max-width: 230px; border-radius: 12px; display: block; margin-bottom: 8px; }
  .typing-dots span { display: inline-block; width: 7px; height: 7px; margin-right: 4px; border-radius: 50%; background: var(--text-dim); animation: blink 1.2s infinite; }
  .typing-dots span:nth-child(2) { animation-delay: .2s; }
  .typing-dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
  /* ---- preview ---- */
  #preview { display: none; padding: 0 18px 8px; max-width: 780px; width: 100%; margin: 0 auto; align-items: center; gap: 8px; }
  #preview.show { display: flex; }
  #preview img { max-height: 84px; border-radius: 12px; border: 1px solid var(--border); }
  #preview button { background: var(--bg-soft); color: var(--text-dim); border: 1px solid var(--border); border-radius: 14px; padding: 5px 11px; cursor: pointer; font-size: 12px; }
  /* ---- input bar ---- */
  #bar { padding: 10px 18px calc(14px + env(safe-area-inset-bottom)); max-width: 780px; width: 100%; margin: 0 auto; }
  #barinner {
    display: flex; gap: 8px; align-items: center;
    background: var(--bg-soft); border: 1px solid var(--border); border-radius: 28px;
    padding: 6px 6px 6px 8px;
  }
  #barinner:focus-within { border-color: var(--accent); }
  #imgbtn {
    background: transparent; border: none; color: var(--text-dim);
    width: 38px; height: 38px; font-size: 19px; cursor: pointer; border-radius: 50%; flex-shrink: 0;
  }
  #imgbtn:active { background: #ffffff14; }
  #input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-size: 15px; padding: 10px 4px; min-width: 0;
  }
  #input::placeholder { color: #5b6472; }
  #send {
    width: 40px; height: 40px; border-radius: 50%; border: none; flex-shrink: 0;
    background: linear-gradient(135deg, #2f6fed, #5b8cff); color: #fff;
    font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 10px rgba(47,111,237,.4);
  }
  #send:disabled { opacity: .45; box-shadow: none; cursor: default; }
</style>
</head>
<body>
<header>
  <div class="avatar">N</div>
  <div class="who">
    <div class="name">Namya</div>
    <div class="status">Online</div>
  </div>
  <div id="meminfo" title="What Namya remembers about you"></div>
</header>
<div id="chat"></div>
<div id="preview"><img id="previewimg" alt="attachment preview"><button id="clearimg">✕ remove</button></div>
<div id="bar">
  <div id="barinner">
    <button id="imgbtn" title="Attach an image">＋</button>
    <input type="file" id="fileinput" accept="image/*" style="display:none">
    <input id="input" placeholder="Message Namya..." autocomplete="off">
    <button id="send" title="Send">↑</button>
  </div>
</div>
<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const imgBtn = document.getElementById("imgbtn");
  const fileInput = document.getElementById("fileinput");
  const preview = document.getElementById("preview");
  const previewImg = document.getElementById("previewimg");
  const clearImg = document.getElementById("clearimg");
  const memInfo = document.getElementById("meminfo");
  const history = [];
  let pendingImage = null;

  let memories = [];
  try { memories = JSON.parse(localStorage.getItem("namya_memories") || "[]"); } catch {}
  function renderMemInfo() {
    memInfo.textContent = memories.length ? `🧠 ${memories.length}` : "";
  }
  memInfo.onclick = () => {
    if (!memories.length) return;
    alert("Namya remembers:\n\n• " + memories.join("\n• "));
  };
  renderMemInfo();

  function addMsg(role, text, typing = false, imgDataUrl = null) {
    const row = document.createElement("div");
    row.className = "row " + role;
    if (role === "model") {
      const av = document.createElement("div");
      av.className = "avatar sm";
      av.textContent = "N";
      row.appendChild(av);
    }
    const d = document.createElement("div");
    d.className = "msg";
    if (typing) {
      d.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span>';
    } else {
      if (imgDataUrl) {
        const im = document.createElement("img");
        im.className = "attached";
        im.src = imgDataUrl;
        d.appendChild(im);
      }
      const s = document.createElement("span");
      s.textContent = text;
      d.appendChild(s);
    }
    row.appendChild(d);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }

  imgBtn.onclick = () => fileInput.click();
  fileInput.onchange = () => {
    const f = fileInput.files[0];
    if (!f) return;
    if (f.size > 4 * 1024 * 1024) { alert("Image too large (max 4MB)."); return; }
    const rd = new FileReader();
    rd.onload = () => {
      const dataUrl = rd.result;
      pendingImage = { mimeType: f.type || "image/jpeg", data: dataUrl.split(",")[1] };
      previewImg.src = dataUrl;
      preview.classList.add("show");
    };
    rd.readAsDataURL(f);
    fileInput.value = "";
  };
  clearImg.onclick = () => { pendingImage = null; preview.classList.remove("show"); };

  async function send() {
    const text = input.value.trim();
    if (!text && !pendingImage) return;
    input.value = "";
    sendBtn.disabled = true;
    const imgDataUrl = pendingImage ? `data:${pendingImage.mimeType};base64,${pendingImage.data}` : null;
    addMsg("user", text || "(image)", false, imgDataUrl);
    history.push({ role: "user", text: text || "What do you see in this image?" });
    const images = pendingImage ? [pendingImage] : [];
    pendingImage = null;
    preview.classList.remove("show");
    const t = addMsg("model", "", true);
    try {
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history, memories, images }),
      });
      const j = await r.json();
      if (j.reply) {
        t.textContent = j.reply;
        history.push({ role: "model", text: j.reply });
        if (Array.isArray(j.newMemories) && j.newMemories.length) {
          for (const m of j.newMemories) {
            if (m && !memories.includes(m)) memories.push(m);
          }
          memories = memories.slice(-50);
          localStorage.setItem("namya_memories", JSON.stringify(memories));
          renderMemInfo();
        }
      } else {
        t.textContent = "Error: " + (j.error || "unknown");
      }
    } catch {
      t.textContent = "Error: could not reach the server.";
    }
    sendBtn.disabled = false;
    chat.scrollTop = chat.scrollHeight;
    input.focus();
  }

  sendBtn.onclick = send;
  input.onkeydown = (e) => { if (e.key === "Enter") send(); };
  addMsg("model", "Salam! Ana Namya, l assistant li bnah Aymane.");
  input.focus();
</script>
</body>
</html>
