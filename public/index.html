<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Namya — AI Assistant</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #0f1115; color: #e8eaf0; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 14px 20px; border-bottom: 1px solid #23262f; font-weight: 600; }
  header span { color: #8b93a7; font-weight: 400; font-size: 13px; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; max-width: 800px; width: 100%; margin: 0 auto; }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: #2b6ef6; color: #fff; border-bottom-right-radius: 4px; }
  .model { align-self: flex-start; background: #1c1f27; border-bottom-left-radius: 4px; }
  .typing { opacity: 0.6; font-style: italic; }
  #bar { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid #23262f; max-width: 800px; width: 100%; margin: 0 auto; }
  #input { flex: 1; padding: 12px 16px; border-radius: 24px; border: 1px solid #2c313d; background: #1a1d24; color: #e8eaf0; font-size: 15px; outline: none; }
  #send { padding: 12px 22px; border-radius: 24px; border: none; background: #2b6ef6; color: #fff; font-size: 15px; cursor: pointer; }
  #send:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<header>Namya <span>— personal AI assistant built by Aymane</span></header>
<div id="chat"></div>
<div id="bar">
  <input id="input" placeholder="Type a message..." autocomplete="off">
  <button id="send">Send</button>
</div>
<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const history = [];

  function addMsg(role, text, typing = false) {
    const d = document.createElement("div");
    d.className = "msg " + role + (typing ? " typing" : "");
    d.textContent = text;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    sendBtn.disabled = true;
    addMsg("user", text);
    history.push({ role: "user", text });
    const t = addMsg("model", "...", true);
    try {
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      const j = await r.json();
      t.classList.remove("typing");
      if (j.reply) {
        t.textContent = j.reply;
        history.push({ role: "model", text: j.reply });
      } else {
        t.textContent = "Error: " + (j.error || "unknown");
      }
    } catch {
      t.classList.remove("typing");
      t.textContent = "Error: could not reach the server.";
    }
    sendBtn.disabled = false;
    chat.scrollTop = chat.scrollHeight;
  }

  sendBtn.onclick = send;
  input.onkeydown = (e) => { if (e.key === "Enter") send(); };
  addMsg("model", "Salam! Ana Namya, l assistant li bnah Aymane.");
  input.focus();
</script>
</body>
</html>
