<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Namya — AI Assistant</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #0f1115; color: #e8eaf0; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 14px 20px; border-bottom: 1px solid #23262f; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  header span { color: #8b93a7; font-weight: 400; font-size: 13px; }
  #meminfo { font-size: 12px; color: #8b93a7; cursor: pointer; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; max-width: 800px; width: 100%; margin: 0 auto; }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: #2b6ef6; color: #fff; border-bottom-right-radius: 4px; }
  .model { align-self: flex-start; background: #1c1f27; border-bottom-left-radius: 4px; }
  .typing { opacity: 0.6; font-style: italic; }
  .msg img.attached { max-width: 220px; border-radius: 10px; display: block; margin-bottom: 8px; }
  #preview { display: none; padding: 0 20px 8px; max-width: 800px; width: 100%; margin: 0 auto; }
  #preview img { max-height: 90px; border-radius: 10px; }
  #preview button { background: #2c313d; color: #e8eaf0; border: none; border-radius: 12px; padding: 4px 10px; margin-left: 8px; cursor: pointer; font-size: 12px; }
  #bar { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid #23262f; max-width: 800px; width: 100%; margin: 0 auto; align-items: center; }
  #input { flex: 1; padding: 12px 16px; border-radius: 24px; border: 1px solid #2c313d; background: #1a1d24; color: #e8eaf0; font-size: 15px; outline: none; }
  #send { padding: 12px 22px; border-radius: 24px; border: none; background: #2b6ef6; color: #fff; font-size: 15px; cursor: pointer; }
  #send:disabled { opacity: 0.5; cursor: default; }
  #imgbtn { background: #1a1d24; border: 1px solid #2c313d; color: #e8eaf0; border-radius: 50%; width: 42px; height: 42px; font-size: 18px; cursor: pointer; flex-shrink: 0; }
</style>
</head>
<body>
<header>
  <div>Namya <span>— personal AI assistant built by Aymane</span></div>
  <div id="meminfo" title="What Namya remembers about you"></div>
</header>
<div id="chat"></div>
<div id="preview"><img id="previewimg" alt="attachment preview"><button id="clearimg">✕ remove</button></div>
<div id="bar">
  <button id="imgbtn" title="Attach an image">📷</button>
  <input type="file" id="fileinput" accept="image/*" style="display:none">
  <input id="input" placeholder="Type a message..." autocomplete="off">
  <button id="send">Send</button>
</div>
<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const imgBtn = document.getElementById("imgbtn");
  const fileInput = document.getElementById("fileinput");
  const preview = document.getElementById("preview");
  const previewImg = document.getElementById("previewimg");
  const clearImg = document.getElementById("clearimg");
  const memInfo = document.getElementById("meminfo");
  const history = [];
  let pendingImage = null; // {mimeType, data}

  // ---- memory (localStorage) ----
  let memories = [];
  try { memories = JSON.parse(localStorage.getItem("namya_memories") || "[]"); } catch {}
  function renderMemInfo() {
    memInfo.textContent = memories.length ? `🧠 ${memories.length}` : "";
  }
  memInfo.onclick = () => {
    if (!memories.length) return;
    alert("Namya remembers:\n\n• " + memories.join("\n• "));
  };
  renderMemInfo();

  function addMsg(role, text, typing = false, imgDataUrl = null) {
    const d = document.createElement("div");
    d.className = "msg " + role + (typing ? " typing" : "");
    if (imgDataUrl) {
      const im = document.createElement("img");
      im.className = "attached";
      im.src = imgDataUrl;
      d.appendChild(im);
    }
    const s = document.createElement("span");
    s.textContent = text;
    d.appendChild(s);
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }

  imgBtn.onclick = () => fileInput.click();
  fileInput.onchange = () => {
    const f = fileInput.files[0];
    if (!f) return;
    if (f.size > 4 * 1024 * 1024) { alert("Image too large (max 4MB)."); return; }
    const rd = new FileReader();
    rd.onload = () => {
      const dataUrl = rd.result;
      pendingImage = { mimeType: f.type || "image/jpeg", data: dataUrl.split(",")[1] };
      previewImg.src = dataUrl;
      preview.style.display = "block";
    };
    rd.readAsDataURL(f);
    fileInput.value = "";
  };
  clearImg.onclick = () => { pendingImage = null; preview.style.display = "none"; };

  async function send() {
    const text = input.value.trim();
    if (!text && !pendingImage) return;
    input.value = "";
    sendBtn.disabled = true;
    const imgDataUrl = pendingImage ? `data:${pendingImage.mimeType};base64,${pendingImage.data}` : null;
    addMsg("user", text || "(image)", false, imgDataUrl);
    history.push({ role: "user", text: text || "What do you see in this image?" });
    const images = pendingImage ? [pendingImage] : [];
    pendingImage = null;
    preview.style.display = "none";
    const t = addMsg("model", "...", true);
    try {
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history, memories, images }),
      });
      const j = await r.json();
      t.classList.remove("typing");
      if (j.reply) {
        t.textContent = j.reply;
        history.push({ role: "model", text: j.reply });
        if (Array.isArray(j.newMemories) && j.newMemories.length) {
          for (const m of j.newMemories) {
            if (m && !memories.includes(m)) memories.push(m);
          }
          memories = memories.slice(-50);
          localStorage.setItem("namya_memories", JSON.stringify(memories));
          renderMemInfo();
        }
      } else {
        t.textContent = "Error: " + (j.error || "unknown");
      }
    } catch {
      t.classList.remove("typing");
      t.textContent = "Error: could not reach the server.";
    }
    sendBtn.disabled = false;
    chat.scrollTop = chat.scrollHeight;
  }

  sendBtn.onclick = send;
  input.onkeydown = (e) => { if (e.key === "Enter") send(); };
  addMsg("model", "Salam! Ana Namya, l assistant li bnah Aymane.");
  input.focus();
</script>
</body>
</html>
